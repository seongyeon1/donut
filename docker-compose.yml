version: '3.8'

services:
  donut-mcp-server:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: donut-mcp-server
    ports:
      - "8000:8000"
    volumes:
      # Mount examples directory for testing
      - ./examples:/app/examples:ro
      # Mount custom models if needed
      - ./models:/app/models:ro
      # Mount output directory for results
      - ./output:/app/output
      # Mount configuration files
      - ./config:/app/config:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Model configuration
      - MODEL_NAME=naver-clova-ix/donut-base-finetuned-cord-v2
      # Server configuration
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      # Logging
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - donut-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Optional: Add a reverse proxy with nginx for production
  nginx:
    image: nginx:alpine
    container_name: donut-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
    depends_on:
      - donut-mcp-server
    restart: unless-stopped
    networks:
      - donut-network
    profiles:
      - production

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: donut-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - donut-network
    profiles:
      - production

networks:
  donut-network:
    driver: bridge

volumes:
  output:
    driver: local
  redis_data:
    driver: local
